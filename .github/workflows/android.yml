name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      - name: Setup Android KeyStore
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') }}
        run: |
          base64 -d <<< "$KEYSTORE_FILE" > android.jks
      - name: Build debug application
        run: |
          ./gradlew assembleDebug
      - name: Build application
        env:
          KEYSTORE_PATH: android.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./gradlew assembleRelease
      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: app/build/outputs/apk/debug/**/*
      - name: Upload release build
        uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release
          path: app/build/outputs/apk/release/**/*
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') }}
        run: |
          cd app/build/outputs/apk/release
          gh release create --title "Release ${{ github.ref_name }}" "${{ github.ref_name }}" *.apk
